<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E03C7A"/>
      <stop offset="1" stop-color="#C95AB0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#09090B"/>
  <g fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round" filter="url(#glow)">
    <circle cx="256" cy="256" r="160"/>
    <circle cx="292" cy="256" r="118"/>
    <circle cx="322" cy="256" r="80"/>
  </g>
</svg>
